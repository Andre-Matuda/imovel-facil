spring:
  cache:
    cache-names: properties
  application:
    name: imovel-facil

  datasource:
    url: jdbc:h2:mem:imoveis

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches
info:
  app:
    name: Imóvel Fácil API
    version: 1.0.0